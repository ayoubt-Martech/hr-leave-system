# MMG-HR — Nginx reverse proxy configuration
# Place at: /etc/nginx/sites-available/mmg-hr
# Enable: ln -s /etc/nginx/sites-available/mmg-hr /etc/nginx/sites-enabled/mmg-hr
# Reload: nginx -t && systemctl reload nginx

# Redirect all HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name hr.martechlabs.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hr.martechlabs.io;

    # ─── SSL (managed by Certbot / Let's Encrypt) ──────────────────────────
    ssl_certificate     /etc/letsencrypt/live/hr.martechlabs.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hr.martechlabs.io/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ─── Security headers ──────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"           always;
    add_header X-Content-Type-Options    "nosniff"              always;
    add_header X-XSS-Protection          "1; mode=block"        always;
    add_header Referrer-Policy           "strict-origin"        always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ─── Gzip ──────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ─── Client body size (for Excel uploads) ─────────────────────────────
    client_max_body_size 10M;

    # ─── Proxy API requests → Express (port 4000) ──────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # ─── Health check (no-log) ─────────────────────────────────────────────
    location /health {
        proxy_pass         http://127.0.0.1:4000;
        proxy_set_header   Host $host;
        access_log         off;
    }

    # ─── Serve built React SPA ─────────────────────────────────────────────
    # The Express server already serves /dist in production, but if you prefer
    # Nginx to serve static files directly (faster), uncomment this block and
    # comment out the SPA catch-all proxy block below.
    #
    # root /srv/mmg-hr/dist;
    # index index.html;
    # location / {
    #     try_files $uri $uri/ /index.html;
    # }
    # location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    #     expires 1y;
    #     add_header Cache-Control "public, immutable";
    # }

    # ─── SPA catch-all → Express (serves /dist/index.html) ────────────────
    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
